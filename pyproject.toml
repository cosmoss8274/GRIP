[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grip-models"
version = "0.2.0"
description = "GRIP models for peptide–MHC–TCR interactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chai Yi"}]
requires-python = ">=3.9"
dependencies = [
  "torch>=2.6",
  "numpy",
  "pandas",
  "einops",
  "biopython",
]

[project.optional-dependencies]
inverse = ["fair-esm", "ml-collections", "dm-tree"]

[project.urls]
Repository = "https://github.com/cosmoss8274/GRIP"
Issues = "https://github.com/cosmoss8274/GRIP/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["grip_models", "grip_models.*"]
namespaces = false
