[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grip-models"
version = "0.1.0.dev0"
description = "Conditional energy models for peptide–receptor interactions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chai Yi"}]
requires-python = ">=3.9"
dependencies = [
  "torch>=2.6",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "einops",
  "biopython",
]

[project.urls]
Repository = "https://github.com/cosmoss8274/GRIP"
Issues = "https://github.com/cosmoss8274/GRIP/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["grip_models"]
namespaces = false

[tool.setuptools.package-data]
grip_models = ["source_changes.json"]
